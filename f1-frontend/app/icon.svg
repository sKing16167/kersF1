<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Ultra-Vibrant Motorsport F1 Red Gradient -->
    <linearGradient id="kersRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3333" />
      <stop offset="45%" stop-color="#FF1801" />
      <stop offset="100%" stop-color="#D70000" />
    </linearGradient>

    <!-- Deep Carbon Motorsport Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141722" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Glowing aero drop shadow for tab pop -->
    <filter id="kersRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#FF1801" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2" />

  <!-- Aerodynamic Forward-Raked K Mark scaled to fill the canvas prominently -->
  <g transform="translate(14, 38) scale(1.35) skewX(-16)">
    <g fill="url(#kersRedGrad)" filter="url(#kersRedGlow)">
      <!-- Speed Bar 1 (Top / Longest / Sharp Tip) -->
      <path d="M 2 5 L 40 5 L 40 9 L 14 9 Z" />

      <!-- Speed Bar 2 -->
      <path d="M 12 12.5 L 40 12.5 L 40 16.5 L 18 16.5 Z" />

      <!-- Speed Bar 3 (Middle) -->
      <path d="M 18 20 L 40 20 L 40 24 L 23 24 Z" />

      <!-- Speed Bar 4 -->
      <path d="M 23 27.5 L 40 27.5 L 40 31.5 L 28 31.5 Z" />

      <!-- Speed Bar 5 (Bottom / Shortest) -->
      <path d="M 27 35 L 40 35 L 40 39 L 32 39 Z" />

      <!-- The Letter K Body -->
      <!-- Vertical Spine -->
      <path d="M 39 5 L 47 5 L 47 41 L 39 41 Z" />

      <!-- Upper Diagonal Arm -->
      <path d="M 47 25 L 61 5 L 72 5 L 52 30 Z" />

      <!-- Lower Diagonal Leg -->
      <path d="M 50 23 L 73 41 L 62 41 L 44 28 Z" />
    </g>
  </g>
</svg>